<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 300px; margin: 0; padding: 14px; background: #18181b; color: #f4f4f5; font: 13px system-ui; }
      h1 { font-size: 15px; margin: 0 0 10px; }
      label { display: block; font-size: 11px; color: #a1a1aa; margin: 8px 0 3px; text-transform: uppercase; letter-spacing: .04em; }
      input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid #3f3f46; background: #09090b; color: #fff; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
      button { width: 100%; margin-top: 10px; padding: 8px; border-radius: 6px; border: 0; background: #3987e5; color: #fff; font-weight: 600; cursor: pointer; }
      #status { margin-top: 8px; font-size: 12px; color: #a1a1aa; }
    </style>
  </head>
  <body>
    <h1>📦 FlipDesk</h1>
    <label>Server URL</label>
    <input id="server" type="text" placeholder="http://localhost:8787" />
    <label>Extension token (Settings page)</label>
    <input id="token" type="text" />
    <label>Marketplaces to handle</label>
    <div class="grid" id="sites"></div>
    <label><input id="auto" type="checkbox" /> Auto-open new jobs</label>
    <button id="save">Save & test</button>
    <button id="now" style="background:#27272a">Check for jobs now</button>
    <div id="status"></div>
    <script src="sites.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
