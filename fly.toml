# Fly.io: `fly launch --copy-config --no-deploy`, then `fly volumes create flipdesk_data --size 3`,
# set secrets (see docs/DEPLOY.md), then `fly deploy`.
app = "flipdesk-CHANGE-ME"
primary_region = "ord"

[build]

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8787"
  FLIPDESK_DB = "/data/flipdesk.db"
  FLIPDESK_UPLOADS = "/data/uploads"

[[mounts]]
  source = "flipdesk_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Keep one machine running: background jobs (sales polling, delists, price drops) need it awake.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
